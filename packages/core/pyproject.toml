[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-studio-core"
version = "0.1.1"
description = "Deterministic core for WeChat Content Studio projects, contracts, styles, and delivery artifacts."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "platformdirs>=4.3,<5",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
