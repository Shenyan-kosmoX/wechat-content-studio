name: Public review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sors:
    uses: Shenyan-kosmoX/community/.github/workflows/sors-project-review.yml@0802493a9228dbd0c1b9eefc288ff803cee08265
    with:
      checker-ref: 0802493a9228dbd0c1b9eefc288ff803cee08265
  source-and-example:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install editable source
        run: python -m pip install -e packages/core -e apps/cli pytest
      - name: Check public file selection
        run: python tools/check_public_release.py
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Render example and exercise skill launchers
        run: python tools/smoke_public.py --output .local/ci-smoke
